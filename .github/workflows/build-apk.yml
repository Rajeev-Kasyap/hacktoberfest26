    name: Build Android APK                                                                                                                                
                                                                                                                                                           
    on:                                                                                                                                                    
      push:                                                                                                                                                
        branches: [ "main", "master" ]                                                                                                                     
      workflow_dispatch:                                                                                                                                   
                                                                                                                                                           
    jobs:                                                                                                                                                  
      build-android:                                                                                                                                       
        runs-on: ubuntu-latest                                                                                                                             
                                                                                                                                                           
        steps:                                                                                                                                             
          - name: Checkout code                                                                                                                            
            uses: actions/checkout@v4                                                                                                                      
                                                                                                                                                           
          - name: Setup Node.js                                                                                                                            
            uses: actions/setup-node@v4                                                                                                                    
            with:                                                                                                                                          
              node-version: 20                                                                                                                             
                                                                                                                                                           
          - name: Setup Java SDK                                                                                                                           
            uses: actions/setup-java@v4                                                                                                                    
            with:                                                                                                                                          
              distribution: 'zulu'                                                                                                                         
              java-version: '17'                                                                                                                           
                                                                                                                                                           
          - name: Install npm dependencies                                                                                                                 
            run: |                                                                                                                                         
              cd hostel-chef                                                                                                                               
              npm ci || npm install                                                                                                                        
                                                                                                                                                           
          - name: Build Web Assets                                                                                                                         
            run: |                                                                                                                                         
              cd hostel-chef                                                                                                                               
              npm run build                                                                                                                                
                                                                                                                                                           
          - name: Sync Capacitor
            run: |
              cd hostel-chef
              npx cap sync android
            
          - name: Build APK
            run: |
              cd hostel-chef/android
              chmod +x ./gradlew
              ./gradlew assembleDebug
              
          - name: Upload APK Artifact
            uses: actions/upload-artifact@v4
            with:
              name: app-debug.apk
              path: hostel-chef/android/app/build/outputs/apk/debug/app-debug.apk
